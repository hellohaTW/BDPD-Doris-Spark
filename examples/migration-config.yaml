# Example config for the one-shot Iceberg -> Doris migration job.
#   DORIS_PASSWORD=... spark-submit \
#     --class com.yourteam.ingestion.IcebergMigrationJob \
#     target/spark-doris-ingestion.jar /path/to/migration-config.yaml
#
# Same fat jar as the streaming ingestion job, different --class. Batch, not streaming:
# it reads the whole Iceberg table once and OVERWRITES the Doris target, then exits.

iceberg:
  catalog_name: "iceberg"             # Spark catalog name to register the source under
  catalog_type: "hive"                # hive (default) | hadoop | rest
  uri: "thrift://metastore:9083"      # Hive Metastore thrift URI — required for a hive catalog.
                                      #   Named explicitly here (not inherited from hive-site.xml)
                                      #   so a missing/wrong metastore fails fast at startup.
  # warehouse: "s3a://warehouse/"     # required for a hadoop catalog; optional override otherwise
  database: "lake"                    # source Iceberg namespace
  table: "orders"                     # source Iceberg table
  # properties:                       # optional; extra catalog props, keyed by the suffix after
  #   clients: "5"                    #   spark.sql.catalog.<name>. (e.g. HMS client pool size)
  #
  # Storage credentials do NOT belong here. With the default FileIO (HadoopFileIO) Iceberg reads
  # through the Hadoop FileSystem API, so s3a://, hdfs:// etc. pick up the cluster's existing
  # settings — typically spark.hadoop.fs.s3a.{access.key,secret.key,endpoint} in
  # spark-defaults.conf. Leave io-impl unset to keep that behaviour: setting it to S3FileIO
  # switches to Iceberg's own S3 client, which IGNORES those fs.s3a settings (it wants a separate
  # s3.access-key-id/s3.secret-access-key) and needs the AWS SDK, which this jar does not bundle.
  # To override a Hadoop setting for this job only, use spark.extra_conf below (spark.hadoop.*).

doris:
  fenodes: "doris-fe:8030"
  database: "ods"
  table: "orders"                     # must already exist with a schema compatible with the source;
                                      #   this job issues no DDL. Columns match by NAME.
  user: "ingest"
  password_env: "DORIS_PASSWORD"      # optional: env var holding the password (never inline it).
                                      #   omit it, or leave the var unset, for an empty password.
  options:                            # optional; passed to the Doris writer VERBATIM (doris.* keys)
    doris.sink.batch.size: "100000"
    doris.sink.max-retries: "3"

spark:                                # optional
  extra_conf:                         #   applied to the SparkSession via .config(k, v)
    spark.sql.shuffle.partitions: "16"
    # spark.master: "local[*]"        # set ONLY when running via `java -jar` off-cluster;
                                      #   omit on a cluster (spark-submit supplies --master)
    # spark.hadoop.fs.s3a.endpoint: "http://minio:9000"   # per-job override of a cluster Hadoop
    # spark.hadoop.fs.s3a.path.style.access: "true"       #   setting; normally these live in
                                                          #   spark-defaults.conf instead.
